<svg xmlns="http://www.w3.org/2000/svg" width="840" height="960" viewBox="0 0 840 960" role="img" aria-labelledby="title desc"><title id="title">AgentFlow narrow board and task detail — design study</title><desc id="desc">Two static 375-pixel frames with synthetic data. One selected lane on the left. Full-page task detail on the right, with an attempt timeline and human acceptance note. This is not a working interface.</desc><g font-family="system-ui, -apple-system, sans-serif">
